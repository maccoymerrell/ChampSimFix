# SPPAM_B Configuration File
# Lines starting with '#' are comments
# Format: key = value (case-insensitive)

# Branch predictor type: hashed_perceptron, gshare, bimodal, mpp, tage_sc_l
bp_type = mpp

# IP encoding style: ip, region, page_offset, sms, sms_sub, sms_app, sms_back, delta, delta_history, none
ip_style = delta

# Global history type: offset_history, unique_recent_segment_history, ordered_recent_segment_history, recent_xor_history
global_type = ordered_recent_segment_history

# History bit widths
global_bits = 256
local_bits = 64
segment_bits = 64

# Alignment factor (offset from last access when providing history to BP)
alignment_factor = 0

# ==============================================================================
# Throttling controls
# ==============================================================================

# Use per-IP confidence table to gate prefetch issuance (true/false)
use_ip_conf = true

# Enable lookahead: continue prefetching beyond the first predicted block (true/false)
do_lookahead = true

# Probabilistically drop prefetches proportional to confidence (true/false)
prob_drop = false

# Use per-IP prefetch degree instead of the global PREFETCH_DEGREE (true/false)
ip_prefetch_degree = false

# Use per-IP lookahead depth instead of the global MAX_LOOKAHEAD (true/false)
ip_lookahead = false

# ==============================================================================
# Numeric throttle parameters
# ==============================================================================

# Global max prefetch degree (number of cache lines to prefetch per trigger)
prefetch_degree = 8

# Minimum confidence required to continue lookahead prefetching (0.0 - 1.0)
min_lookahead_conf = 0.2

# Minimum confidence required to prefetch into L1D instead of L2C (0.0 - 1.0)
min_l1d_conf = 0.9

# Maximum lookahead depth (number of steps to look ahead)
max_lookahead = 64

# Cycle window for timeliness determination (a prefetch is timely if resolved within this many cycles)
timeliness_cycle = 10000
