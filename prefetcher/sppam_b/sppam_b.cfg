# SPPAM_B Configuration File
# Lines starting with '#' are comments
# Format: key = value (case-insensitive)

# Branch predictor type: hashed_perceptron, gshare, bimodal, mpp, tage_sc_l
bp_type = mpp

# IP encoding style: ip, region, page_offset, sms, sms_sub, sms_app, sms_back, delta, delta_history, none
ip_style = delta

# Global history type: offset_history, unique_recent_segment_history, ordered_recent_segment_history, recent_xor_history
global_type = ordered_recent_segment_history

# History bit widths
global_bits = 256
local_bits = 64
segment_bits = 64

# Alignment factor (offset from last access when providing history to BP)
alignment_factor = 0
