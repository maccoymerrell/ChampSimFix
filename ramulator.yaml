Frontend:
  impl: ChampSim
  clock_ratio: 1
  num_expected_insts: 3000000000
  
  Translation:
    impl: None
              

MemorySystem:
  impl: DRACSystem
  clock_ratio: 1

  DRAM:
    impl: DDR5-VRR
    RFM:
    org:
      preset: DDR5_16Gb_x8
      channel: 4
      rank: 2
      channel_width: 32
    timing:
      preset: DDR5_6400C
    drampower_enable: true
    voltage:
      preset: Default
    current:
      preset: Default

  DRACController:
    impl: DRACController
    prefetch_starve_cycles: 0
    drop_enabled: false
    read_queue_size: 320
    write_queue_size: 320
    prefetch_bundle: true
    demand_bundle: false
    bundle_length: 16
    BHScheduler:
      impl: MinimalistScheduler
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
      #cap: 64
    plugins:
      - ControllerPlugin: {
          impl: ChampSimPlugin }
      #- ControllerPlugin: {
      #    impl: TraceRecorder,
      #    path: "./powertrace.csv" }
      - ControllerPlugin: {
          impl: ActivateCounter,
          output_file: hammer_test,
          cycles_per_heartbeat: 1000000,
          refresh_period: 32e-3,
          histogram_period: 500e-6 }
      - ControllerPlugin: {
          impl: RFMManager,
          sb_mode: false,
          rfm_thresh: 16}
      - ControllerPlugin: {
          impl: CommandCounter,
          commands_to_count: [],
          path: "./trace.txt"}

  AddrMapper:
    impl: MINIMALIST
    gang_size: 2
    spacing: 2
    debug: false